<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인사이트 텍스트 요약기</title>
    <!-- Tailwind CSS (Typography 플러그인 포함하여 마크다운 스타일링 최적화) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Marked.js (마크다운 렌더링용) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-brand-600">
                <i data-lucide="sparkles" class="w-6 h-6"></i>
                <h1 class="font-bold text-xl tracking-tight">인사이트 에디터</h1>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-500 font-medium">
                AI 기반 텍스트 자동 정리
                <button id="settingsBtn" class="flex items-center gap-1 text-slate-400 hover:text-brand-600 transition-colors bg-slate-100 hover:bg-brand-50 px-3 py-1.5 rounded-lg">
                    <i data-lucide="settings" class="w-4 h-4"></i> 연동 설정
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 안내 메시지용 커스텀 모달 (숨김 상태) -->
        <div id="messageBox" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center gap-2 transition-opacity duration-300">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span id="messageText" class="text-sm font-medium"></span>
        </div>

        <!-- 설정 모달 (Notion API 정보 입력) -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden max-h-[90vh] flex flex-col">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="settings-2" class="w-5 h-5"></i> 연동 설정
                    </h3>
                    <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="p-6 space-y-5 overflow-y-auto">
                    <!-- Gemini 설정 추가 -->
                    <div class="pb-4 border-b border-slate-100">
                        <label class="block text-sm font-bold text-brand-600 mb-2 flex items-center gap-1">
                            <i data-lucide="sparkles" class="w-4 h-4"></i> Gemini API 설정
                        </label>
                        <input type="password" id="geminiApiKey" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="AIzaSy...">
                        <p class="text-xs text-slate-500 mt-1">Google AI Studio에서 발급받은 API 키를 입력하세요.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-1">
                            <i data-lucide="book-open" class="w-4 h-4"></i> 노션 연동 설정 (선택)
                        </label>
                        <label class="block text-sm font-medium text-slate-700 mb-1">노션 API 시크릿 키</label>
                        <input type="password" id="notionApiKey" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm mb-3" placeholder="secret_...">
                        
                        <label class="block text-sm font-medium text-slate-700 mb-1">데이터베이스 ID</label>
                        <input type="text" id="notionDbId" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="예: 1234567890abcdef1234567890abcdef">
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button id="saveSettingsBtn" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors">저장하기</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[calc(100vh-140px)] min-h-[600px]">
            
            <!-- 왼쪽: 입력 영역 -->
            <div class="flex flex-col h-full glass-panel rounded-2xl overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4"></i> 원본 텍스트 입력
                    </h2>
                    <button id="clearBtn" class="text-xs text-slate-400 hover:text-red-500 transition-colors flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-3 h-3"></i> 지우기
                    </button>
                </div>
                <div class="flex-1 p-4 flex flex-col relative">
                    <textarea id="inputText" class="w-full h-full resize-none outline-none text-slate-700 leading-relaxed placeholder-slate-400 bg-transparent" placeholder="여기에 정리하고 싶은 기사, 카드뉴스 텍스트, 또는 긴 인사이트 글을 붙여넣어 주세요.&#10;&#10;AI가 읽기 쉬운 구조로 요약해 드립니다."></textarea>
                </div>
                <div class="p-4 bg-slate-50 border-t border-slate-100">
                    <button id="summarizeBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
                        <i data-lucide="wand-2" class="w-5 h-5"></i>
                        <span>구조화 및 요약하기</span>
                    </button>
                </div>
            </div>

            <!-- 오른쪽: 출력 영역 -->
            <div class="flex flex-col h-full glass-panel rounded-2xl overflow-hidden relative bg-white">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                        <i data-lucide="layout-list" class="w-4 h-4"></i> AI 요약 결과
                    </h2>
                    <div class="flex gap-2">
                        <button id="notionExportBtn" class="hidden text-xs bg-slate-800 hover:bg-slate-900 text-white py-1.5 px-3 rounded-lg transition-colors font-medium items-center gap-1">
                            <i data-lucide="send" class="w-3 h-3"></i> 노션으로 보내기
                        </button>
                        <button id="copyBtn" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 py-1.5 px-3 rounded-lg transition-colors font-medium items-center gap-1">
                            <i data-lucide="copy" class="w-3 h-3"></i> 복사하기
                        </button>
                    </div>
                </div>
                
                <!-- 결과 표시 영역 -->
                <div id="outputContainer" class="flex-1 p-6 overflow-y-auto">
                    <!-- 기본 빈 상태 -->
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-400 text-center space-y-4">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-2">
                            <i data-lucide="inbox" class="w-8 h-8 text-slate-300"></i>
                        </div>
                        <p class="text-sm">텍스트를 입력하고<br>요약하기 버튼을 눌러주세요.</p>
                    </div>

                    <!-- 로딩 상태 -->
                    <div id="loadingState" class="hidden h-full flex flex-col items-center justify-center space-y-4">
                        <i data-lucide="loader-2" class="w-8 h-8 text-brand-500 animate-spin"></i>
                        <p class="text-sm text-slate-500 font-medium animate-pulse">AI가 내용을 분석하고 정리하고 있습니다...</p>
                    </div>

                    <!-- 결과 내용 (Markdown 렌더링) -->
                    <div id="resultContent" class="hidden prose prose-slate prose-brand max-w-none">
                        <!-- API 결과가 여기에 삽입됩니다 -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        // DOM 요소
        const inputText = document.getElementById('inputText');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const resultContent = document.getElementById('resultContent');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');

        // 새로 추가된 DOM 요소
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const geminiApiKeyInput = document.getElementById('geminiApiKey');
        const notionApiKeyInput = document.getElementById('notionApiKey');
        const notionDbIdInput = document.getElementById('notionDbId');
        const notionExportBtn = document.getElementById('notionExportBtn');

        let lastGeneratedMarkdown = ""; // 노션 저장을 위해 마크다운 원본 보관
        let savedGeminiKey = localStorage.getItem('geminiApiKey') || '';
        let savedNotionKey = localStorage.getItem('notionApiKey') || '';
        let savedNotionDbId = localStorage.getItem('notionDbId') || '';

        // 설정 로드
        geminiApiKeyInput.value = savedGeminiKey;
        notionApiKeyInput.value = savedNotionKey;
        notionDbIdInput.value = savedNotionDbId;

        // 모달 제어
        settingsBtn.addEventListener('click', () => { settingsModal.classList.remove('hidden'); });
        closeSettingsBtn.addEventListener('click', () => { settingsModal.classList.add('hidden'); });
        saveSettingsBtn.addEventListener('click', () => {
            savedGeminiKey = geminiApiKeyInput.value.trim();
            savedNotionKey = notionApiKeyInput.value.trim();
            savedNotionDbId = notionDbIdInput.value.trim();
            localStorage.setItem('geminiApiKey', savedGeminiKey);
            localStorage.setItem('notionApiKey', savedNotionKey);
            localStorage.setItem('notionDbId', savedNotionDbId);
            settingsModal.classList.add('hidden');
            showMessage("설정이 저장되었습니다.");
        });
        
        // 시스템 프롬프트 (AI 역할 및 출력 형식 지정)
        const systemPrompt = `당신은 길고 복잡한 글, 기사, 카드뉴스 텍스트를 한눈에 보기 쉽게 구조화하는 전문 에디터입니다.
사용자가 텍스트를 제공하면, 이를 다음 세 가지 섹션으로 명확하게 정리해주세요. 
반드시 마크다운 형식을 사용하여 가독성을 극대화해야 합니다. (이모지도 적절히 활용하세요)

출력 형식:
## 🎯 핵심 주제 (한 줄 요약)
(글을 관통하는 가장 중요한 핵심 내용을 한 줄로 작성)

## 📝 주요 내용 요약
* (핵심 포인트 1)
* (핵심 포인트 2)
* (핵심 포인트 3)
(필요에 따라 3~5개의 글머리 기호로 내용을 요약)

## 💡 시사점 및 인사이트
(이 글을 통해 얻을 수 있는 결론, 적용점, 혹은 생각할 거리를 1~2문단으로 작성)`;

        // 커스텀 메시지 박스 함수 (alert 대체)
        function showMessage(text, isError = false) {
            messageText.textContent = text;
            if (isError) {
                messageBox.classList.replace('bg-slate-800', 'bg-red-600');
            } else {
                messageBox.classList.replace('bg-red-600', 'bg-slate-800');
            }
            
            messageBox.classList.remove('hidden');
            messageBox.classList.add('opacity-100');
            
            setTimeout(() => {
                messageBox.classList.remove('opacity-100');
                setTimeout(() => messageBox.classList.add('hidden'), 300);
            }, 3000);
        }

        // 지연 함수
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 지수 백오프를 적용한 API 호출 함수
        async function fetchWithRetry(text) {
            // 외부 환경용 Gemini 모델 URL 및 저장된 API 키 사용
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${savedGeminiKey}`;

            const payload = {
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        if (response.status === 400 && errText.includes("API key not valid")) {
                            throw new Error("유효하지 않은 API 키입니다. 설정을 확인해주세요.");
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        return data.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error("Unexpected API response structure");
                    }

                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error; // 모든 재시도 실패
                    }
                    await sleep(delays[i]); // 대기 후 재시도
                }
            }
        }

        // UI 상태 변경 함수
        function setUIState(state) {
            emptyState.classList.add('hidden');
            loadingState.classList.add('hidden');
            resultContent.classList.add('hidden');
            copyBtn.style.display = 'none';
            notionExportBtn.style.display = 'none';

            if (state === 'loading') {
                loadingState.classList.remove('hidden');
                summarizeBtn.disabled = true;
                summarizeBtn.classList.add('opacity-70', 'cursor-not-allowed');
                summarizeBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 요약 중...';
            } else if (state === 'result') {
                resultContent.classList.remove('hidden');
                copyBtn.style.display = 'flex';
                notionExportBtn.style.display = 'flex';
                summarizeBtn.disabled = false;
                summarizeBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                summarizeBtn.innerHTML = '<i data-lucide="wand-2" class="w-5 h-5"></i> <span>구조화 및 요약하기</span>';
            } else if (state === 'empty') {
                emptyState.classList.remove('hidden');
                summarizeBtn.disabled = false;
                summarizeBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                summarizeBtn.innerHTML = '<i data-lucide="wand-2" class="w-5 h-5"></i> <span>구조화 및 요약하기</span>';
            }
            lucide.createIcons();
        }

        // 텍스트 초기화
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            setUIState('empty');
            resultContent.innerHTML = '';
        });

        // 요약 실행
        summarizeBtn.addEventListener('click', async () => {
            if (!savedGeminiKey) {
                showMessage("연동 설정에서 Gemini API 키를 먼저 입력해주세요.", true);
                settingsModal.classList.remove('hidden');
                return;
            }

            const text = inputText.value.trim();
            
            if (!text) {
                showMessage("요약할 텍스트를 먼저 입력해주세요.", true);
                return;
            }

            setUIState('loading');

            try {
                const markdownText = await fetchWithRetry(text);
                lastGeneratedMarkdown = markdownText; // 노션 저장을 위해 보관
                
                // 마크다운을 HTML로 변환하여 삽입
                resultContent.innerHTML = marked.parse(markdownText);
                setUIState('result');

            } catch (error) {
                console.error("요약 실패:", error);
                setUIState('empty');
                showMessage(error.message || "요약 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", true);
            }
        });

        // 클립보드 복사 (iFrame 환경을 위해 document.execCommand 사용)
        copyBtn.addEventListener('click', () => {
            // 결과 컨테이너의 텍스트(HTML 태그 제외 순수 텍스트)를 가져오거나
            // 원본 마크다운 텍스트를 저장해두고 복사할 수 있습니다.
            // 여기서는 사용자 편의를 위해 렌더링된 텍스트 자체를 복사합니다.
            
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = resultContent.innerText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showMessage("요약 내용이 클립보드에 복사되었습니다.");
                    
                    // 복사 버튼 아이콘 임시 변경
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> 복사완료';
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        lucide.createIcons();
                    }, 2000);
                } else {
                    showMessage("복사에 실패했습니다.", true);
                }
            } catch (err) {
                showMessage("복사 기능을 지원하지 않는 환경입니다.", true);
            }
            
            document.body.removeChild(tempTextArea);
        });

        // 마크다운을 노션 블록으로 변환하는 간단한 파서
        function convertMarkdownToNotionBlocks(markdown) {
            const lines = markdown.split('\n');
            const blocks = [];
            
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                
                if (line.startsWith('## ')) {
                    blocks.push({
                        object: 'block',
                        type: 'heading_2',
                        heading_2: { rich_text: [{ type: 'text', text: { content: line.substring(3).trim() } }] }
                    });
                } else if (line.startsWith('* ') || line.startsWith('- ')) {
                    blocks.push({
                        object: 'block',
                        type: 'bulleted_list_item',
                        bulleted_list_item: { rich_text: [{ type: 'text', text: { content: line.substring(2).trim() } }] }
                    });
                } else {
                    blocks.push({
                        object: 'block',
                        type: 'paragraph',
                        paragraph: { rich_text: [{ type: 'text', text: { content: line } }] }
                    });
                }
            }
            return blocks;
        }

        // 노션 저장하기
        notionExportBtn.addEventListener('click', async () => {
            if (!savedNotionKey || !savedNotionDbId) {
                showMessage("노션으로 보내기(선택)를 사용하시려면 먼저 연동 설정이 필요합니다.", true);
                settingsModal.classList.remove('hidden');
                return;
            }

            const originalHTML = notionExportBtn.innerHTML;
            notionExportBtn.innerHTML = '<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> 보내는 중...';
            notionExportBtn.disabled = true;

            const blocks = convertMarkdownToNotionBlocks(lastGeneratedMarkdown);
            
            // CORS 우회를 위해 프록시 사용 (브라우저 직접 호출용)
            const proxyUrl = 'https://corsproxy.io/?';
            const notionApiUrl = 'https://api.notion.com/v1/pages';

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(notionApiUrl), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${savedNotionKey}`,
                        'Content-Type': 'application/json',
                        'Notion-Version': '2022-06-28'
                    },
                    body: JSON.stringify({
                        parent: { database_id: savedNotionDbId },
                        properties: {
                            // 기본 속성명 처리: 대부분의 한국어 노션 DB는 첫 열이 '이름', 영어는 'Name'입니다. 
                            "이름": { 
                                title: [
                                    { text: { content: "💡 인사이트 요약 (" + new Date().toLocaleDateString() + ")" } }
                                ]
                            }
                        },
                        children: blocks
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    
                    // 만약 '이름' 속성이 없어서 실패했다면 'Name'으로 재시도
                    if (err.message && err.message.includes("Could not find property with name")) {
                        const retryResponse = await fetch(proxyUrl + encodeURIComponent(notionApiUrl), {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${savedNotionKey}`,
                                'Content-Type': 'application/json',
                                'Notion-Version': '2022-06-28'
                            },
                            body: JSON.stringify({
                                parent: { database_id: savedNotionDbId },
                                properties: { "Name": { title: [{ text: { content: "💡 인사이트 요약 (" + new Date().toLocaleDateString() + ")" } }] } },
                                children: blocks
                            })
                        });
                        
                        if (!retryResponse.ok) {
                            const retryErr = await retryResponse.json();
                            throw new Error("노션 속성 매칭 실패 (DB의 첫 번째 열 이름이 '이름'이나 'Name'인지 확인해주세요)");
                        }
                    } else {
                        throw new Error(err.message || response.status);
                    }
                }

                showMessage("노션 페이지로 성공적으로 보냈습니다!");
            } catch (error) {
                console.error(error);
                showMessage("오류: " + error.message, true);
            } finally {
                notionExportBtn.innerHTML = originalHTML;
                notionExportBtn.disabled = false;
                lucide.createIcons();
            }
        });

    </script>
</body>
</html>
